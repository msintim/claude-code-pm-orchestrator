<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in</title><link rel="stylesheet" href="/site.css"></head>
<body>
<main>
  <h1>Sign in</h1>
  <p><input id="user" type="text" name="username" placeholder="Username"></p>
  <p><input id="pw" type="password" name="password" placeholder="Password"></p>
  <p><button id="submit" type="button">Sign in</button></p>
  <div class="login-error" hidden>Invalid credentials</div>
</main>
<script>
  // Test credentials for the fixture only: user "demo", password "fixture-pass-1".
  document.getElementById('submit').addEventListener('click', () => {
    if (document.getElementById('user').value === 'demo' && document.getElementById('pw').value === 'fixture-pass-1') {
      document.cookie = 'promo_session=1; path=/';
      location.href = '/app.html';
    } else {
      document.querySelector('.login-error').hidden = false;
    }
  });
</script>
</body>
</html>
